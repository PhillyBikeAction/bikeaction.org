---
name: 'CI'

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      - name: Cache mount directory
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        with:
          path: |
              var-cache-apt
              var-lib-apt
              root-npm
              user-cache-uv
          key: ${{ runner.os }}-cache-mount-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-cache-mount-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          cache-map: |
            {
              "var-cache-apt": "/var/cache/apt",
              "var-lib-apt": "/var/lib/apt",
              "root-npm": "/root/.npm",
              "user-cache-uv": "/home/user/.cache/uv"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: Dockerfile
          target: dev
          push: false
          load: true
          tags: pbaabp:docker-compose
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            USER_ID=1000
            GROUP_ID=1000

      - name: Mark image as built
        run: mkdir -p .state && touch .state/docker-build-base

      - name: Run lint
        run: make lint
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx

      - name: Cache mount directory
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: cache
        with:
          path: |
              var-cache-apt
              var-lib-apt
              root-npm
              user-cache-uv
          key: ${{ runner.os }}-cache-mount-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-cache-mount-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: cache-mount
          cache-map: |
            {
              "var-cache-apt": "/var/cache/apt",
              "var-lib-apt": "/var/lib/apt",
              "root-npm": "/root/.npm",
              "user-cache-uv": "/home/user/.cache/uv"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build PostGIS Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: compose
          file: compose/Dockerfile.postgis
          push: false
          load: true
          tags: postgis:latest
          cache-from: type=gha,scope=postgis
          cache-to: type=gha,mode=max,scope=postgis

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: Dockerfile
          target: dev
          push: false
          load: true
          tags: pbaabp:docker-compose
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            USER_ID=1000
            GROUP_ID=1000

      - name: Mark image as built
        run: mkdir -p .state && touch .state/docker-build-base

      - name: Run tests
        run: make test
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain

  test-lazer-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for lazer_app changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            lazer:
              - 'lazer_app/**'

      - name: Set up Node.js
        if: steps.filter.outputs.lazer == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: lazer_app/projectLazer/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.lazer == 'true'
        working-directory: lazer_app/projectLazer
        run: npm ci

      - name: Run Angular tests
        if: steps.filter.outputs.lazer == 'true'
        working-directory: lazer_app/projectLazer
        run: npm test -- --watch=false --browsers=ChromeHeadless
