[tool.coverage.run]
omit = []

[tool.ruff]
line-length = 100

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[project]
name="bikeaction.org"
version="0.0.0"
requires-python = "==3.13.*"
dependencies = [
    "asgiref",
    "beautifulsoup4",
    "celery[redis]",
    "channels[daphne]",
    "cmarkgfm",
    "discord-py-interactions",
    "dj-stripe==2.9.2",
    "django",
    "django-admin-csvexport",
    "django-admin-extra-buttons",
    "django-allauth[mfa]",
    "django-anymail[mailgun]",
    "django-bleach",
    "django-cors-headers",
    "django-dotenv",
    "django-email-log",
    "django-environ",
    "django-htmx",
    "django-ical",
    "django-leaflet",
    "django-markdownfield",
    "django-markdownify",
    "django-ordered-model",
    "django-qr-code",
    "django-recaptcha",
    "django-redis",
    "django-relativity",
    "django-sesame",
    "django-sitetree",
    "django-storages[s3]",
    "django-tuieditor",
    "easy-thumbnails",
    "geopy",
    "httpx",
    "markdown",
    "opencv-python-headless",
    "pillow",
    "psycopg2-binary",
    "pyap2",
    "pygit2",
    "pynliner",
    "redis-lock-py",
    "reportlab",
    "sentry-sdk[django]",
    "shapely",
    "wagtail",
    "wagtail-link-block",
    "wagtail-localize",
    "wagtail-localize-git",
    "wagtailset",
    "whitenoise",
]

[dependency-groups]
deploy = [
    "gunicorn",
    "uvicorn",
]
dev = [
    "django-debug-toolbar",
    "hupper",
    "jurigged",
    "ruff",
]
