      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #000;

      width: 100%;

      height: auto;
      margin: 2rem auto 0;

      font-weight: 800;

.homepage-button {
  appearance: button;
  background-color: rgb(131, 189, 86);
  background-image: none;
  border: none;
  border-radius: .5em;
  box-sizing: border-box;
  color: #fff;
  cursor: pointer;
  display: inline-block;
  font-size: 2em;
  font-family: "Big Shoulders";
  font-weight: 700;
  line-height: 1;
  margin: 0 5px 10px 0;
  overflow: visible;
  padding: 15px 40px;
  text-align: center;
  text-decoration: none;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  vertical-align: middle;
  white-space: nowrap;
  transition: all 0.3s ease-in-out;
}
.homepage-button:hover {
  transform: scale(1.05);
}
    main .homepage-button { margin: 1.5rem 0 0; max-width: 100%; white-space: normal; }

      header { padding: .75rem 1rem; }

      main { padding: 1rem; }
      h1 { font-size: clamp(1.5rem, 5vw, 2rem); }
      .illustration {
        width: min(55vw, 15rem, max(3rem, calc(100svh - 21rem)));
        margin-top: 1rem;
      }
      main .homepage-button {
        margin-top: 1rem;
        padding: 12px 24px;
        font-size: 1.5rem;
      }
      footer { padding: .75rem 1rem; }
